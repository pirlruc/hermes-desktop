[package]
name = "hermes-desktop"
version = "0.1.0"
edition = "2021"
description = "Tauri shell for the Hermes desktop app"
license = "MIT"

[build-dependencies]
tauri-build = { version = "=2.0.5", features = [] }
tauri-codegen = "=2.0.4"
tauri-utils = "=2.1.1"

[dependencies]
hermes-core = { path = "../crates/hermes-core" }
idna = "=1.0.3"
idna_adapter = "=1.2.0"
muda = "=0.15.3"
plist = "=1.7.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialize-to-javascript = "=0.1.1"
tauri = { version = "=2.2.5", features = [] }
tauri-codegen = "=2.0.4"
tauri-macros = "=2.0.4"
tauri-runtime = "=2.3.0"
tauri-runtime-wry = "=2.3.0"
tauri-utils = "=2.1.1"
time = "=0.3.36"
url = "=2.5.4"
uuid = "=1.11.0"

[features]
default = []
