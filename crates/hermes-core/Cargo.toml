[package]
name = "hermes-core"
version = "0.1.0"
edition = "2021"
description = "Sync, consent, and local-library reads for Hermes Desktop"
license = "MIT"

[dependencies]
hex = "0.4"
idna = "=1.0.3"
idna_adapter = "=1.2.0"
url = "=2.5.4"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
ureq = { version = "2.12", features = ["json"] }

[dev-dependencies]
tempfile = "3"
