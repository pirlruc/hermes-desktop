# Org-default Dependabot seed (SC-DEP-001/002/003).
# Seeded once into .github/dependabot.yml by sync-templates.sh — never overwritten.
# Add one updates entry per package ecosystem present (uv, docker, pre-commit, …).
# Cadence and open-PR limit: docs/guardrails/supply-chain/profile.thresholds.yml
# Multi-ecosystem docs:
# https://docs.github.com/en/code-security/how-tos/secure-your-supply-chain/secure-your-dependencies/configuring-multi-ecosystem-updates
# Process: https://github.com/pirlruc/methodologies/blob/1.11.0/github-issue-adr/docs/process/dependency-updates.md
#
# Personal-account private git / OCI (uncomment only after creating Dependabot secrets).
#
# These registries stay commented on purpose. Uncommented stubs that reference
# secrets a new adopter has not created make Dependabot fail closed for every
# consumer. Create the secrets under Settings → Secrets and variables →
# Dependabot (not Actions). Dependabot secrets are invisible to workflow jobs.
#
#   DEPENDABOT_GITHUB_TOKEN  fine-grained PAT, Contents: Read, covering private
#                            submodules and reusable-workflow hosts — not only
#                            package deps. Wire as github-private below.
#   DOCKERHUB_USERNAME       dhi.io / Docker Hub username
#   DOCKERHUB_TOKEN          matching registry token
#
# registries:
#   github-private:
#     type: git
#     url: https://github.com
#     username: x-access-token
#     password: ${{secrets.DEPENDABOT_GITHUB_TOKEN}}
#   dhi:
#     type: docker-registry
#     url: https://dhi.io
#     username: ${{secrets.DOCKERHUB_USERNAME}}
#     password: ${{secrets.DOCKERHUB_TOKEN}}
# Then add `registries: [github-private]` (and/or dhi) under each git or docker
# updates entry that needs them. Do not attach github-private to pip. That
# registry is git, and pip does not clone with it.
# When migrating from per-ecosystem configs, close stale Dependabot PRs before
# expecting the grouped all-dependencies PR (open-PR limit otherwise blocks).

version: 2

multi-ecosystem-groups:
  all-dependencies:
    schedule:
      interval: monthly
      time: "06:00"
      timezone: Europe/Lisbon
    commit-message:
      prefix: build
      include: scope
    cooldown:
      default-days: 7

updates:
  - package-ecosystem: github-actions
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: all-dependencies
  # Uncomment when the repo has .pre-commit-config.yaml.
  # - package-ecosystem: pre-commit
  #   directory: /
  #   patterns: ["*"]
  #   multi-ecosystem-group: all-dependencies
  # Uncomment when the repo has vcpkg.json. The registry port is still a
  # separate commit in the registry repo.
  # - package-ecosystem: vcpkg
  #   directory: /
  #   patterns: ["*"]
  #   multi-ecosystem-group: all-dependencies
  # Hash-locked Python tools. Keep the committed requirements.in next to
  # requirements.txt. Do not set registries: [github-private] on this entry.
  # - package-ecosystem: pip
  #   directory: /.github/dependencies/ci-python
  #   patterns: ["*"]
  #   multi-ecosystem-group: all-dependencies
  # KT-BUILD-001: stay on an LTS JDK (17, 21, or 25). Uncomment to ignore a
  # non-LTS major. The dependency-name is the image token the FROM line writes.
  # Do not ignore an LTS bump here.
  # - package-ecosystem: docker
  #   directory: /
  #   patterns: ["*"]
  #   multi-ecosystem-group: all-dependencies
  #   ignore:
  #     - dependency-name: "eclipse-temurin"
  #       versions: ["22", "23", "24", "26"]
  # Git submodules. Keep this outside the group. Merge the pull request only
  # when the proposed tip is an annotated tag, and move the bootstrap ref in
  # the same pull request (SC-DEP-004). Uncomment registries above first.
  # - package-ecosystem: gitsubmodule
  #   directory: /
  #   schedule:
  #     interval: monthly
  #     time: "06:00"
  #     timezone: Europe/Lisbon
  #   registries:
  #     - github-private
  #   commit-message:
  #     prefix: build
  #     include: scope
  #   cooldown:
  #     default-days: 7
